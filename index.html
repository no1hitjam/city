<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>City</title>
  <style>
    :root {
      --bg: #0c120e;
      --fg: #c6f6a8;
      --muted: #6f8a63;
      --line: #243026;
      --font: Consolas, "Courier New", monospace;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      font-family: var(--font);
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #info {
      flex: 0 0 44px;
      width: 100%;
      height: 44px;
      min-height: 44px;
      max-height: 44px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 1ch;
      padding: 0 1rem;
      border-bottom: 1px solid var(--line);
      letter-spacing: 0.02em;
      user-select: none;
      overflow: hidden;
    }
    #info-label {
      flex: 0 0 auto;
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      line-height: 1;
    }
    #info-value {
      flex: 1 1 auto;
      min-width: 0;
      height: 1em;
      min-height: 1em;
      max-height: 1em;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 1rem;
      line-height: 1;
    }
    #view {
      flex: 1 1 auto;
      display: block;
      width: 100%;
      min-height: 0;
      cursor: grab;
      touch-action: none;
    }
    #view.dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="info">
      <span id="info-label">Hover</span>
      <span id="info-value"></span>
    </div>
    <canvas id="view"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
